name: Release

# Publishes the action version that tracks a Glyph release: smoke-tests the
# action against that release, pins it as the `version` default, tags the
# commit with the Glyph version, moves `v1` to it and publishes the release.
# Glyph's release workflow starts this for each new Glyph release; run it by
# hand from the Actions tab, on main, to catch up on one it missed. After a
# failure, start a new run: Re-run reuses the commit the failed run started
# from, and stops once main has moved past it.
#
# Everything that writes uses RELEASE_TOKEN, a token of the account that
# listed this action on the Marketplace, kept in the `release` environment
# (deployments limited to main). A fine-grained token with Contents read and
# write on this repository is enough.
#
# The release this publishes is not on the Marketplace yet. The API that
# creates releases has no Marketplace option, so a release made here stays
# off the listing whichever token makes it, until the publisher ticks
# "Publish this Action to the GitHub Marketplace" on its edit page and saves.
# The run's summary links that page. The token is still the publisher's
# because GitHub does not list a release whose author cannot pass the
# publisher's two-factor check, which rules out GITHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Glyph release to track, e.g. v0.26.0
        required: true

permissions:
  contents: read

# One release at a time. A run queued behind another stops at the release
# job, because main has moved since it started.
concurrency:
  group: release

jobs:
  check:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check the version and the token
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Run this from main, not ${GITHUB_REF}: the release pushes the commit it tested to main."
            exit 1
          fi
          if ! [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be a Glyph release tag like v0.26.0, got '${VERSION}'."
            exit 1
          fi
          if [ -z "${RELEASE_TOKEN}" ] || ! GH_TOKEN="${RELEASE_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}" --silent; then
            echo "::error::RELEASE_TOKEN is missing from the release environment or no longer valid. Add a token of the account that publishes this action to the Marketplace, with Contents read and write on this repository."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} already exists, so it is released already, or a stray tag to delete first."
            exit 1
          fi
          PINNED="$(yq -r '.inputs.version.default' action.yml)"
          NEWEST="$(printf '%s\n%s\n' "${PINNED}" "${VERSION}" | sort -V | tail -n 1)"
          if [ "${NEWEST}" != "${VERSION}" ]; then
            echo "::error::action.yml already pins ${PINNED}, which is newer than ${VERSION}, and releasing ${VERSION} would move v1 back."
            exit 1
          fi

  smoke:
    needs: check
    uses: ./.github/workflows/smoke.yml
    with:
      version: ${{ inputs.version }}

  release:
    needs: smoke
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Pin the release as the default
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "${MAIN}" != "${GITHUB_SHA}" ]; then
            echo "::error::main is at ${MAIN}, but this run tested ${GITHUB_SHA}; start a new run."
            exit 1
          fi
          PINNED="$(yq -r '.inputs.version.default' action.yml)"
          if [ "${PINNED}" = "${VERSION}" ]; then
            echo "action.yml already pins ${VERSION}."
            exit 0
          fi
          # The pin has three copies: the input's default, the fallback for an
          # empty input, and the README's inputs table. The minimum version the
          # docs mention is a different number and stays.
          PINNED_RE="${PINNED//./[.]}"
          sed -i -e "s/^\(    default: \)${PINNED_RE}$/\1${VERSION}/" \
            -e "s/\${VERSION:-${PINNED_RE}}/\${VERSION:-${VERSION}}/" action.yml
          sed -i "s/^| \`version\` | \`${PINNED_RE}\` |/| \`version\` | \`${VERSION}\` |/" README.md
          if [ "$(yq -r '.inputs.version.default' action.yml)" != "${VERSION}" ] \
            || ! grep -qF "\${VERSION:-${VERSION}}" action.yml \
            || ! grep -qF "| \`version\` | \`${VERSION}\` |" README.md; then
            git diff
            echo "::error::Could not move every copy of the pin from ${PINNED} to ${VERSION}; update this step to match action.yml and README.md."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: track Glyph ${VERSION}"
          git push origin HEAD:main

      - name: Move v1 and publish the release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          # v1 is the alias most callers use, so it moves on purpose. It moves
          # before the release exists, so a run that fails in between has not
          # made the version tag yet, and a new run finishes the job.
          git tag -f v1 "${SHA}"
          git push -f origin refs/tags/v1
          gh release create "${VERSION}" --repo "${GITHUB_REPOSITORY}" --target "${SHA}" \
            --title "${VERSION}" --generate-notes \
            --notes "Tracks Glyph [${VERSION}](https://github.com/hamidfzm/glyph/releases/tag/${VERSION}), and installs that release by default."
          echo "Released ${VERSION} at ${SHA}; v1 points there now."
          EDIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/edit/${VERSION}"
          echo "::notice title=List ${VERSION} on the Marketplace::Not listed until ticked by hand: open ${EDIT_URL}, tick \"Publish this Action to the GitHub Marketplace\" and save."
          {
            echo "## List ${VERSION} on the Marketplace"
            echo
            echo "GitHub has no API for the Marketplace checkbox, so this release is not listed yet. Open [its edit page](${EDIT_URL}), tick **Publish this Action to the GitHub Marketplace** and click **Update release**."
          } >> "${GITHUB_STEP_SUMMARY}"
