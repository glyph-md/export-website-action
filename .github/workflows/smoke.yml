name: Smoke test

# Gates every change to the action with a real install + export against the
# Glyph release the action pins by default. Dispatch it with a version to test
# any other release; the release workflow calls it with the one it is about to
# pin.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Glyph release to test against
        default: latest
  workflow_call:
    inputs:
      version:
        type: string
        required: true

jobs:
  export:
    # Callers run the action on ubuntu-latest, which moves from 24.04 to 26.04
    # over several weeks, so every change is proven on both images.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Create a fixture workspace
        run: |
          mkdir -p fixture/guide
          printf '# Fixture\n\nSee [[intro]].\n' > fixture/README.md
          # shellcheck disable=SC2016 # the backticks are a literal mermaid fence
          printf '# Intro\n\n```mermaid\ngraph TD; A-->B;\n```\n' > fixture/guide/intro.md

      - uses: ./
        id: export
        with:
          workspace: fixture
          output: out
          # Left empty on push and pull_request, so the smoke exercises the
          # action's pinned default. e2e-samples covers `latest` instead.
          version: ${{ inputs.version }}

      - name: Verify output
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/guide/intro.html
          test -f out/style.css
          grep -q 'guide/intro.html' out/index.html
          grep -q '<svg' out/guide/intro.html
          echo "Site verified: $(find out -type f | wc -l) files"
