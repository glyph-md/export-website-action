name: "Export Glyph Workspace as Website"
description: >-
  Install Glyph and export a folder of markdown files as a linked static
  website (one HTML page per file, wikilinks resolved, images copied, Mermaid
  rendered). Ideal for publishing a notes workspace to GitHub Pages.
author: glyph-md
branding:
  icon: book-open
  color: purple

inputs:
  workspace:
    description: Path to the markdown workspace folder to export.
    required: true
  output:
    description: Directory the generated site is written to.
    required: false
    default: site
  version:
    description: >-
      Glyph release to install, e.g. "v0.23.0". Defaults to the latest
      release. This action calls `glyph export --format site`, so it needs a
      release carrying that subcommand; pin an action tag matching the Glyph
      release you install rather than pairing an old binary with a new action.
    required: false
    default: latest
  timeout-seconds:
    description: Fail the export if it has not finished after this many seconds.
    required: false
    default: "600"

outputs:
  path:
    description: The output directory containing the generated site.
    value: ${{ steps.export.outputs.path }}

runs:
  using: composite
  steps:
    - name: Install Glyph
      shell: bash
      run: |
        set -euo pipefail
        if [ "${RUNNER_OS}" != "Linux" ]; then
          echo "::error::glyph-md/export-website-action only supports Linux runners (needs apt + xvfb)."
          exit 1
        fi
        ARCH="$(dpkg --print-architecture)"
        # An empty version (e.g. a caller forwarding absent workflow inputs)
        # means the same as "latest"; a bare tag 404s the releases API.
        VERSION="${{ inputs.version }}"
        if [ -z "${VERSION}" ] || [ "${VERSION}" = "latest" ]; then
          API_URL="https://api.github.com/repos/hamidfzm/glyph/releases/latest"
        else
          API_URL="https://api.github.com/repos/hamidfzm/glyph/releases/tags/${VERSION}"
        fi
        DEB_URL="$(curl -fsSL "${API_URL}" | jq -r --arg arch "_${ARCH}.deb" \
          '.assets[] | select(.name | endswith($arch)) | .browser_download_url')"
        if [ -z "${DEB_URL}" ] || [ "${DEB_URL}" = "null" ]; then
          echo "::error::No ${ARCH} .deb asset found for Glyph ${VERSION:-latest}."
          exit 1
        fi
        echo "Installing ${DEB_URL}"
        curl -fsSL -o /tmp/glyph.deb "${DEB_URL}"
        sudo apt-get update -qq
        sudo apt-get install -y -qq /tmp/glyph.deb xvfb
        glyph --version || true

    - name: Export website
      id: export
      shell: bash
      env:
        # WebKitGTK quirks on headless/virtual displays.
        WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        WEBKIT_DISABLE_DMABUF_RENDERER: "1"
      run: |
        set -euo pipefail
        WORKSPACE="${{ inputs.workspace }}"
        OUTPUT="${{ inputs.output }}"
        if [ ! -d "${WORKSPACE}" ]; then
          echo "::error::Workspace folder not found: ${WORKSPACE}"
          exit 1
        fi

        # One spelling, the current one. This action's tag tracks the Glyph
        # release it targets, so it does not branch on what it found. It does
        # check that the binary has the subcommand: without that check the
        # export below would treat "export" as a path to open and sit there
        # until the timeout expired, which reads as a hang rather than as the
        # version mismatch it is.
        VERSION_LINE="$(glyph --version 2>/dev/null || true)"
        GLYPH_VERSION="${VERSION_LINE##* }"
        if ! glyph --help 2>/dev/null | grep -q "glyph export"; then
          echo "::error::Glyph ${GLYPH_VERSION:-(unknown version)} has no \`glyph export\` subcommand. Pin an action tag matching the Glyph release you install, or leave \`version\` at latest."
          exit 1
        fi
        echo "Glyph ${GLYPH_VERSION}: exporting ${WORKSPACE} to ${OUTPUT}"

        timeout "${{ inputs.timeout-seconds }}" \
          xvfb-run --auto-servernum \
          glyph export "${WORKSPACE}" --format site --out "${OUTPUT}"
        echo "path=${OUTPUT}" >> "${GITHUB_OUTPUT}"
        echo "Exported site:"
        find "${OUTPUT}" -type f | head -50
